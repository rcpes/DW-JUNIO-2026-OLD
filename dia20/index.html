<body>



    <div>

        <div class="form-container">

            <div class="form-header">
                <h2>Registro de Usuario</h2>
                <p>Ingresa tus datos para completar el formulario.</p>
            </div>

            <form action="getform.php" method="get" class="modern-form">

                <div class="form-group">
                    <label for="first-name">Nombre</label>
                    <input type="text" id="first-name" name="first_name" placeholder="Ej. Ana" required />
                </div>


                <div class="form-group">
                    <label for="last-name">Apellido</label>
                    <input type="text" id="last-name" name="last_name" placeholder="Ej. Pérez" required />
                </div>


                <div class="form-group">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="ana.perez@ejemplo.com" required />
                </div>


                <div class="form-group">
                    <label for="email">Escribe tu mensaje a enviar:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" cols="55" placeholder="Escribe aquí..."></textarea>
                </div>




                <button type="submit" class="submit-btn">Enviar datos</button>
            </form>
        </div>

    </div>
